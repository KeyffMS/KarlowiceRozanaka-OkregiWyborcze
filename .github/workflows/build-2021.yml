name: Build district GeoJSON and PDF - 2021

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts-2021/**"
      - "data-2021/source-2021/**"
      - "requirements-2021.txt"
      - ".github/workflows/build-2021.yml"

permissions:
  contents: write

jobs:
  build-2021:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-2021.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-2021.txt

      - name: Build GeoJSON 2021
        run: python scripts-2021/build-districts-2021.py

      - name: Build PDF 2021
        run: python scripts-2021/build-pdf-2021.py

      - name: Commit generated 2021 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geojson-2021 data-2021/generated-2021 docs-2021 pdf-2021
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate 2021 district GeoJSON and PDF"
          git push
