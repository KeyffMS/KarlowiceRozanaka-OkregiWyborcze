name: Estimate v6 population
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "analysis-v6/okregi-v6.geojson"
      - "scripts-tools/estimate-v6-population.py"
      - ".github/workflows/estimate-v6-population.yml"

permissions:
  contents: write

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests geopandas pyogrio shapely
      - run: python scripts-tools/estimate-v6-population.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-v6/population-estimate.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add v6 population estimate"
          git pull --rebase origin main
          git push
