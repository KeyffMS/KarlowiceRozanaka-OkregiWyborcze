name: Fetch OSM API railway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts-tools/fetch-osm-api-railway.py"
      - ".github/workflows/fetch-osm-api-railway.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python scripts-tools/fetch-osm-api-railway.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-gis
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fetch railway tracks from OSM API"
          git pull --rebase origin main
          git push
