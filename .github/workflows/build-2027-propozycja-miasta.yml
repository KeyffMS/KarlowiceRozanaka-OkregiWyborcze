name: Build district GeoJSON and PDF - 2027 - propozycja miasta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts-2027-propozycja-miasta/**"
      - "data-2027-propozycja-miasta/source-2027-propozycja-miasta/**"
      - "requirements-2027-propozycja-miasta.txt"
      - ".github/workflows/build-2027-propozycja-miasta.yml"

permissions:
  contents: write

jobs:
  build-2027-propozycja-miasta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-2027-propozycja-miasta.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-2027-propozycja-miasta.txt

      - name: Build GeoJSON - 2027 city proposal
        run: python scripts-2027-propozycja-miasta/build-districts-2027-propozycja-miasta.py

      - name: Build PDF - 2027 city proposal
        run: python scripts-2027-propozycja-miasta/build-pdf-2027-propozycja-miasta.py

      - name: Commit generated 2027 proposal data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geojson-2027-propozycja-miasta data-2027-propozycja-miasta/generated-2027-propozycja-miasta docs-2027-propozycja-miasta pdf-2027-propozycja-miasta
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate 2027 city proposal GeoJSON and PDF"
          git push
