name: Publish PDF reports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts-reports/**"
      - ".github/workflows/publish-pdf-reports.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install reportlab pillow pymupdf geopandas matplotlib pyogrio shapely
      - run: python scripts-reports/build-comparison-pdf.py
      - run: python scripts-reports/build-final-v6-pdf.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf-porownanie-2021-vs-2027-propozycja-miasta pdf-final-propozycja
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish comparison and final proposal PDFs"
          git pull --rebase origin main
          git push
