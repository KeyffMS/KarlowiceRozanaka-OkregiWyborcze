name: Inspect demographic archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts-tools/inspect-demography.py"
      - ".github/workflows/inspect-demography.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests
      - run: python scripts-tools/inspect-demography.py
